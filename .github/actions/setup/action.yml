name: Set up toolchain
description: Go, uv, Node and Task, plus the pinned tools in .bin/ (cached). Versions match Taskfile.yml.
inputs:
  factory:
    description: "'true' to also install the factory and functional-test tools (apko, melange, cosign, crane, grype, syft, kind, kubectl)"
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27.4"
        cache-dependency-path: Taskfile.yml
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.3"
        python-version: "3.12"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
    - uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c # v3.0.0
      with:
        version: "3.45.4"
        repo-token: ${{ github.token }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .bin
          ~/.cache/puppeteer
        key: tools-${{ inputs.factory == 'true' && 'factory-' || '' }}${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Taskfile.yml', 'tools/mermaid/package-lock.json') }}
    - name: Install pinned tools
      shell: bash
      run: task tools
    - name: Install factory and functional-test tools
      if: inputs.factory == 'true'
      shell: bash
      run: task tools:factory tools:functest
