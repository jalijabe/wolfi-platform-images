# SPIRE Controller Manager, built from source: Wolfi ships 0.6.6 and TCP
# SPIFFE mTLS mode needs >= 0.8. v0.8.1 needs Go 1.27.3 (go.mod at the tag).
package:
  name: spire-controller-manager-src
  version: "0.8.1"
  epoch: 0
  description: SPIRE Controller Manager, built from source by the image factory
  copyright:
    - license: Apache-2.0

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27
  environment:
    # Build with the pinned Go only; never download a toolchain go.mod asks for.
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/spiffe/spire-controller-manager
      tag: v${{package.version}}
      expected-commit: 823124bb8d0bb54c29793f82e9edce2cc2cd5c7b

  # Dependency fixes the CVE gate requires (grype, 2026-11-15): x/net v0.59.0
  # (GO-2026-6612 critical; GO-2026-6603/6610/6611/6617 high) and go-jose/v4
  # v4.1.5 (CVE-2026-116587, high).
  - uses: go/bump
    with:
      deps: golang.org/x/net@v0.60.0 github.com/go-jose/go-jose/v4@v4.1.6

  # Upstream builds with CGO_ENABLED=0 (Dockerfile); so do we.
  - uses: go/build
    with:
      go-package: go-1.27
      packages: ./cmd/main.go
      output: spire-controller-manager
    environment:
      CGO_ENABLED: "0"
