# SPIRE on Kubernetes for the functional test: the server with the controller
# manager as a sidecar, agents attesting with projected service-account tokens
# (k8s_psat), and the SPIFFE CSI driver exposing the Workload API to pods.
# Based on the upstream examples (spiffe/spiffe-csi example/config,
# spiffe/spire-controller-manager config/), hardened: every container drops
# all capabilities and has a read-only root filesystem; only the CSI node
# plugin is privileged, which mount propagation requires.
# Image placeholders (dollar-brace names) are filled in by test_spire_kubernetes.py.
apiVersion: v1
kind: Namespace
metadata:
  name: spire-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: spire-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-server
rules:
  # k8s_psat attestation: review agent tokens and resolve their pods and nodes.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get"]
  # spire-controller-manager (upstream config/rbac/role.yaml at v0.8.1, minus
  # validatingwebhookconfigurations: the webhook is disabled in this test).
  - apiGroups: [""]
    resources: ["endpoints", "namespaces", "nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["spire.spiffe.io"]
    resources: ["clusterfederatedtrustdomains", "clusterspiffeids", "clusterstaticentries"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["spire.spiffe.io"]
    resources:
      - clusterfederatedtrustdomains/finalizers
      - clusterspiffeids/finalizers
      - clusterstaticentries/finalizers
    verbs: ["update"]
  - apiGroups: ["spire.spiffe.io"]
    resources:
      - clusterfederatedtrustdomains/status
      - clusterspiffeids/status
      - clusterstaticentries/status
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: spire-system
roleRef:
  kind: ClusterRole
  name: spire-server
  apiGroup: rbac.authorization.k8s.io
---
# The k8sbundle notifier keeps the trust bundle in this ConfigMap for agents.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spire-server-bundle
  namespace: spire-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["spire-bundle"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spire-server-bundle
  namespace: spire-system
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: spire-system
roleRef:
  kind: Role
  name: spire-server-bundle
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-bundle
  namespace: spire-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server
  namespace: spire-system
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      socket_path = "/run/spire/server-sockets/api.sock"
      trust_domain = "example.org"
      data_dir = "/run/spire/data"
      log_level = "DEBUG"
    }
    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "sqlite3"
          connection_string = "/run/spire/data/datastore.sqlite3"
        }
      }
      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "functest" = {
              service_account_allow_list = ["spire-system:spire-agent"]
            }
          }
        }
      }
      KeyManager "memory" {
        plugin_data {}
      }
      Notifier "k8sbundle" {
        plugin_data {
          namespace = "spire-system"
        }
      }
    }
    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
  controller-manager.yaml: |
    apiVersion: spire.spiffe.io/v1alpha1
    kind: ControllerManagerConfig
    metrics:
      bindAddress: 127.0.0.1:8082
    health:
      healthProbeBindAddress: 0.0.0.0:8083
    leaderElection:
      leaderElect: false
    clusterName: functest
    trustDomain: example.org
    ignoreNamespaces: [kube-system, kube-public, kube-node-lease, local-path-storage, spire-system]
    spireServerSocketPath: /run/spire/server-sockets/api.sock
    validatingWebhookConfigurationName: spire-controller-manager-webhook
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: spire-system
  annotations:
    # This throwaway test cluster runs images loaded into kind by digest (Never pulled).
    checkov.io/skip1: "CKV_K8S_14=Image placeholders are filled with images loaded into kind by digest"
    checkov.io/skip2: "CKV_K8S_43=Image placeholders are filled with images loaded into kind by digest"
    checkov.io/skip3: "CKV_K8S_15=Images are loaded into kind; pulling them is not possible"
    checkov.io/skip4: "CKV2_K8S_6=Single-node throwaway test cluster; network policy is the deployer's choice"
    checkov.io/skip5: "CKV_K8S_38=The server (k8s_psat token reviews) and controller manager call the Kubernetes API"
spec:
  replicas: 1
  serviceName: spire-server
  selector:
    matchLabels:
      app: spire-server
  template:
    metadata:
      labels:
        app: spire-server
    spec:
      serviceAccountName: spire-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spire-server
          image: ${SERVER_IMAGE}
          imagePullPolicy: Never
          args: ["-config", "/run/spire/config/server.conf"]
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: data
              mountPath: /run/spire/data
            - name: server-sockets
              mountPath: /run/spire/server-sockets
        - name: spire-controller-manager
          image: ${CONTROLLER_IMAGE}
          imagePullPolicy: Never
          args: ["--config=/run/spire/config/controller-manager.yaml"]
          env:
            # The validating webhook needs a Service and a webhook
            # configuration; this test covers entry reconciliation.
            - name: ENABLE_WEBHOOKS
              value: "false"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8083
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: server-sockets
              mountPath: /run/spire/server-sockets
      volumes:
        - name: config
          configMap:
            name: spire-server
        - name: data
          emptyDir: {}
        - name: server-sockets
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: spire-system
spec:
  selector:
    app: spire-server
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-agent
  namespace: spire-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-agent
rules:
  # k8s workload attestation through the kubelet.
  - apiGroups: [""]
    resources: ["pods", "nodes", "nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-agent
subjects:
  - kind: ServiceAccount
    name: spire-agent
    namespace: spire-system
roleRef:
  kind: ClusterRole
  name: spire-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent
  namespace: spire-system
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire/data"
      log_level = "DEBUG"
      server_address = "spire-server.spire-system.svc"
      server_port = "8081"
      socket_path = "/run/spire/agent-sockets/spire-agent.sock"
      trust_bundle_path = "/run/spire/bundle/bundle.crt"
      trust_domain = "example.org"
    }
    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = "functest"
        }
      }
      KeyManager "memory" {
        plugin_data {}
      }
      WorkloadAttestor "k8s" {
        plugin_data {
          skip_kubelet_verification = true
        }
      }
    }
    health_checks {
      listener_enabled = true
      bind_address = "127.0.0.1"
      bind_port = "8088"
      live_path = "/live"
      ready_path = "/ready"
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire-system
  annotations:
    # This throwaway test cluster runs images loaded into kind by digest (Never pulled).
    checkov.io/skip1: "CKV_K8S_14=Image placeholders are filled with images loaded into kind by digest"
    checkov.io/skip2: "CKV_K8S_43=Image placeholders are filled with images loaded into kind by digest"
    checkov.io/skip3: "CKV_K8S_15=Images are loaded into kind; pulling them is not possible"
    checkov.io/skip4: "CKV2_K8S_6=Single-node throwaway test cluster; network policy is the deployer's choice"
    checkov.io/skip5: "CKV_K8S_38=The k8s workload attestor authenticates to the kubelet with the service account token"
    checkov.io/skip6: "CKV_K8S_17=Workload attestation reads the processes of every pod on the node (upstream runs it so)"
    checkov.io/skip7: "CKV_K8S_19=The agent reaches the kubelet on the node's loopback (upstream runs it so)"
    checkov.io/skip8: "CKV_K8S_23=The image runs as root by design: workload attestation reads other users' /proc entries"
    checkov.io/skip9: "CKV_K8S_40=The image runs as root by design: workload attestation reads other users' /proc entries"
spec:
  selector:
    matchLabels:
      app: spire-agent
  template:
    metadata:
      labels:
        app: spire-agent
    spec:
      serviceAccountName: spire-agent
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: spire-agent
          image: ${AGENT_IMAGE}
          imagePullPolicy: Never
          args: ["-config", "/run/spire/config/agent.conf"]
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /ready
              port: 8088
            periodSeconds: 2
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /live
              port: 8088
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: bundle
              mountPath: /run/spire/bundle
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: data
              mountPath: /run/spire/data
            - name: agent-sockets
              mountPath: /run/spire/agent-sockets
      volumes:
        - name: config
          configMap:
            name: spire-agent
        - name: bundle
          configMap:
            name: spire-bundle
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  path: spire-agent
                  expirationSeconds: 7200
                  audience: spire-server
        - name: data
          emptyDir: {}
        - name: agent-sockets
          hostPath:
            path: /run/spire/agent-sockets
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spiffe-csi-driver
  namespace: spire-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spiffe-csi-driver
  namespace: spire-system
  annotations:
    # This throwaway test cluster runs images loaded into kind by digest (Never pulled).
    checkov.io/skip1: "CKV_K8S_14=Image placeholders are filled with images loaded into kind by digest"
    checkov.io/skip2: "CKV_K8S_43=Image placeholders are filled with images loaded into kind by digest"
    checkov.io/skip3: "CKV_K8S_15=Images are loaded into kind; pulling them is not possible"
    checkov.io/skip4: "CKV2_K8S_6=Single-node throwaway test cluster; network policy is the deployer's choice"
    checkov.io/skip5: "CKV_K8S_16=A CSI node plugin needs privileged mode for Bidirectional mount propagation"
    checkov.io/skip6: "CKV_K8S_20=Implied by privileged mode, which a CSI node plugin needs"
    checkov.io/skip7: "CKV_K8S_23=The image runs as root by design: it mounts volumes into pod paths on the host"
    checkov.io/skip8: "CKV_K8S_40=The image runs as root by design: it mounts volumes into pod paths on the host"
    checkov.io/skip9: "CKV_K8S_8=The driver serves no health endpoint; the registrar's /healthz covers the socket"
    checkov.io/skip10: "CKV_K8S_9=The driver serves no health endpoint; the registrar's /healthz covers the socket"
spec:
  selector:
    matchLabels:
      app: spiffe-csi-driver
  template:
    metadata:
      labels:
        app: spiffe-csi-driver
    spec:
      serviceAccountName: spiffe-csi-driver
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spiffe-csi-driver
          image: ${CSI_IMAGE}
          imagePullPolicy: Never
          args:
            - -workload-api-socket-dir
            - /spire-agent-socket
            - -csi-socket-path
            - /spiffe-csi/csi.sock
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            privileged: true
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - name: agent-sockets
              mountPath: /spire-agent-socket
              readOnly: true
            - name: csi-socket
              mountPath: /spiffe-csi
            - name: mountpoint
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
        - name: node-driver-registrar
          image: ${REGISTRAR_IMAGE}
          imagePullPolicy: IfNotPresent
          args:
            - -csi-address
            - /spiffe-csi/csi.sock
            - -kubelet-registration-path
            - /var/lib/kubelet/plugins/csi.spiffe.io/csi.sock
            - -http-endpoint
            - 0.0.0.0:9809
          ports:
            - name: healthz
              containerPort: 9809
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: csi-socket
              mountPath: /spiffe-csi
            - name: registration
              mountPath: /registration
      volumes:
        - name: agent-sockets
          hostPath:
            path: /run/spire/agent-sockets
            type: DirectoryOrCreate
        - name: csi-socket
          hostPath:
            path: /var/lib/kubelet/plugins/csi.spiffe.io
            type: DirectoryOrCreate
        - name: mountpoint
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: registration
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.spiffe.io
spec:
  attachRequired: false
  podInfoOnMount: true
  fsGroupPolicy: None
  volumeLifecycleModes:
    - Ephemeral
